[phases.setup]
nixPkgs = [
  "nodejs_20",
  "python312",
  "python312Packages.pip",
  "gcc",
  "libcxx",
  "lapack",
  "blas",
  "libxml2",
  "libxslt",
  "zlib.out",
  "libjpeg_turbo",
  "libpng",
  "libtiff",
  "pkg-config",
  "postgresql"
]

[phases.install]
commands = [
  "npm install --include=dev",
  "npm run build",
  "mkdir -p /usr/lib && LIBSTDCPP=$(find /nix/store -name 'libstdc++.so.6' | head -n 1) && ln -sf $LIBSTDCPP /usr/lib/libstdc++.so.6",
  "pip install --no-cache-dir --break-system-packages -r requirements.txt"
]

