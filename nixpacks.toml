[phases.build]
cmds = [
    # Install Python NLP models
    "python3 -m spacy download en_core_web_sm",
    "python3 -m nltk.downloader -d /opt/nltk_data punkt stopwords",
    # Clean install of Node.js dependencies, fix permissions, and build
    "npm ci",
    "chmod -R +x node_modules/.bin",
    "npm run build"
]