# Configures the build environment for Nixpacks
[phases.setup]
# Specifies the necessary system packages. We need Python, pip, and Node.js.
nixPkgs = ["python311", "pip", "nodejs_20"]

# Configures the installation phase
[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "npm install --include=dev"
]

# Configures the build phase
[phases.build]
cmds = [
    "npm run build"
]