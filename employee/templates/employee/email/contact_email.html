<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contact Form Submission</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
        }
        .header {
            background-color: #1a237e;
            color: white;
            padding: 10px 20px;
            border-radius: 5px 5px 0 0;
            margin: -20px -20px 20px;
        }
        .footer {
            background-color: #f5f5f5;
            padding: 10px 20px;
            border-top: 1px solid #ddd;
            margin: 20px -20px -20px;
            border-radius: 0 0 5px 5px;
            font-size: 12px;
            color: #666;
        }
        .field {
            margin-bottom: 15px;
        }
        .label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .message-content {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #1a237e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Contact Form Submission</h2>
        </div>
        
        <div class="field">
            <div class="label">Name:</div>
            <div>{{ name }}</div>
        </div>
        
        <div class="field">
            <div class="label">Email:</div>
            <div>{{ email }}</div>
        </div>
        
        <div class="field">
            <div class="label">Subject:</div>
            <div>{{ subject }}</div>
        </div>
        
        <div class="field">
            <div class="label">Message:</div>
            <div class="message-content">{{ message }}</div>
        </div>
        
        <div class="footer">
            This email was sent from the GeoConnect contact form.
        </div>
    </div>
</body>
</html>
